<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#0f172a"/>

  <!-- Car body outline — sports coupe profile, stroke-only like the logo -->
  <path
    d="M3 21.5 L5.5 18 C7 15.5 9.5 14 12 13.5 L16 13 L20 13.5 C22.5 14 25 15.5 26.5 18 L29 21.5"
    stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Roof arch -->
  <path
    d="M10 21.5 C10 21.5 11 16.5 13.5 14.5 C14.8 13.5 17.2 13.5 18.5 14.5 C21 16.5 22 21.5 22 21.5"
    stroke="white" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="9"  cy="23" r="2.2" stroke="white" stroke-width="1.3"/>
  <circle cx="23" cy="23" r="2.2" stroke="white" stroke-width="1.3"/>

  <!-- Orange speed-line accents (mirrors the horizontal dashes in the logo) -->
  <line x1="1" y1="19.5" x2="4.5" y2="19.5" stroke="#f97316" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="1" y1="21.2" x2="3.2" y2="21.2" stroke="#f97316" stroke-width="0.9" stroke-linecap="round"/>
</svg>
